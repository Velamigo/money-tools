<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>熏悟空工具箱</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  :root{
    --bg:#0a0e1a;--card:#131826;--border:#1e2a44;--accent:#6c5ce7;
    --text:#e3e6f0;--dim:#8892b0;--green:#00d68f;--red:#ff6b6b;
    --gold:#ffd700;--blue:#3b82f6;--input-bg:#0d1117;
  }
  [data-theme="light"]{
    --bg:#f0f2f5;--card:#ffffff;--border:#d0d5dd;--accent:#6c5ce7;
    --text:#1a1a2e;--dim:#667085;--green:#009a6b;--red:#e63946;
    --gold:#b8860b;--blue:#2563eb;--input-bg:#f8f9fa;
  }
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;transition:.3s;}
  .nav{display:flex;gap:8px;padding:16px 20px;background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;align-items:center;}
  .nav-btn{padding:10px 20px;border:1px solid var(--border);border-radius:10px;background:transparent;color:var(--dim);cursor:pointer;font-size:14px;transition:.2s;font-weight:500;}
  .nav-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .nav-btn:hover:not(.active){border-color:var(--accent);color:var(--text);}
  .nav-right{margin-left:auto;display:flex;gap:8px;align-items:center;}
  .icon-btn{width:38px;height:38px;border:1px solid var(--border);border-radius:10px;background:transparent;color:var(--text);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:.2s;}
  .icon-btn:hover{border-color:var(--accent);background:var(--accent);color:#fff;}
  .page{display:none;max-width:800px;margin:0 auto;padding:20px;}
  .page.active{display:block;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;margin-bottom:16px;}
  .card h2{font-size:18px;margin-bottom:16px;display:flex;align-items:center;gap:8px;}
  .input-group{margin-bottom:14px;}
  label{display:block;font-size:13px;color:var(--dim);margin-bottom:6px;}
  input,select{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:10px;background:var(--input-bg);color:var(--text);font-size:15px;outline:none;transition:.2s;}
  input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(108,92,231,.15);}
  .row{display:flex;gap:12px;}
  .row .input-group{flex:1;}
  .btn{padding:12px 24px;border:none;border-radius:10px;background:var(--accent);color:#fff;cursor:pointer;font-size:15px;font-weight:600;transition:.2s;}
  .btn:hover{opacity:.85;}
  .btn.green{background:var(--green);color:#000;}
  .btn.red{background:var(--red);}
  .btn.sm{padding:6px 14px;font-size:13px;}
  .result-box{background:var(--input-bg);border:1px solid var(--border);border-radius:12px;padding:20px;margin-top:16px;}
  .result-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);}
  .result-row:last-child{border:none;}
  .result-label{color:var(--dim);font-size:14px;}
  .result-value{font-size:18px;font-weight:700;}
  .profit{color:var(--green);}
  .loss{color:var(--red);}
  .badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:12px;font-weight:600;}
  .badge-green{background:rgba(0,214,143,.15);color:var(--green);}
  .badge-red{background:rgba(255,107,107,.15);color:var(--red);}
  table{width:100%;border-collapse:collapse;margin-top:12px;}
  th{text-align:left;padding:10px 12px;border-bottom:2px solid var(--border);color:var(--dim);font-size:13px;}
  td{padding:10px 12px;border-bottom:1px solid var(--border);font-size:14px;}
  tr:hover td{background:rgba(108,92,231,.05);}
  .person-tag{display:inline-block;padding:4px 12px;border-radius:20px;font-size:13px;font-weight:600;margin:2px;}
  .tag-0{background:rgba(108,92,231,.2);color:#a29bfe;}
  [data-theme="light"] .tag-0{color:#6c5ce7;}
  .tag-1{background:rgba(0,214,143,.2);color:var(--green);}
  .tag-2{background:rgba(255,107,107,.2);color:var(--red);}
  .tag-3{background:rgba(255,215,0,.2);color:var(--gold);}
  .tag-4{background:rgba(59,130,246,.2);color:var(--blue);}
  .tag-5{background:rgba(255,159,67,.2);color:#ff9f43;}
  [data-theme="light"] .tag-5{color:#e67e00;}
  .empty{text-align:center;color:var(--dim);padding:40px;font-size:14px;}
  .settle-card{background:linear-gradient(135deg,rgba(108,92,231,.1),rgba(0,214,143,.08));border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;}
  .settle-from{font-weight:600;}
  .settle-arrow{color:var(--dim);margin:0 12px;}
  .settle-to{font-weight:600;}
  .settle-amount{font-size:20px;font-weight:800;color:var(--green);}
  .del{color:var(--red);cursor:pointer;font-size:18px;padding:4px 8px;border:none;background:none;}
  .del:hover{opacity:.7;}
  .summary-bar{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px;}
  .summary-item{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;text-align:center;}
  .summary-num{font-size:24px;font-weight:800;}
  .summary-label{font-size:12px;color:var(--dim);margin-top:4px;}
  @media(max-width:600px){.summary-bar{grid-template-columns:1fr;}.row{flex-direction:column;}.nav{flex-wrap:wrap;}.nav-right{margin-left:0;}}
</style>
</head>
<body>
<div class="nav">
  <button class="nav-btn active" data-i18n="fx" onclick="showPage('fx',this)">💱 汇率换算</button>
  <button class="nav-btn" data-i18n="ledger" onclick="showPage('ledger',this)">📝 记账均摊</button>
  <div class="nav-right">
    <button class="icon-btn" onclick="toggleLang()" id="langBtn">EN</button>
    <button class="icon-btn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
</div>

<!-- ========== 汇率换算 ========== -->
<div id="fx" class="page active">
  <div class="card">
    <h2 data-i18n="fx_title">💱 CNY ↔ INR 现金兑换计算器</h2>

    <div class="row">
      <div class="input-group">
        <label data-i18n="direction">方向</label>
        <select id="direction" onchange="calcFX()">
          <option value="cny2inr" data-i18n="cny2inr">人民币 → 印度卢比</option>
          <option value="inr2cny" data-i18n="inr2cny">印度卢比 → 人民币</option>
        </select>
      </div>
      <div class="input-group">
        <label id="amountLabel" data-i18n="amount_cny">输入金额 (CNY)</label>
        <input type="number" id="amount" value="10000" oninput="calcFX()" placeholder="0">
      </div>
    </div>

    <div class="row">
      <div class="input-group">
        <label data-i18n="my_rate">我的实际汇率</label>
        <input type="number" id="myRate" value="11.5" step="0.01" oninput="calcFX()" placeholder="0">
      </div>
      <div class="input-group">
        <label data-i18n="intl_rate">国际参考汇率</label>
        <input type="number" id="intlRate" value="11.8" step="0.01" oninput="calcFX()" placeholder="0">
      </div>
    </div>

    <div class="row">
      <div class="input-group">
        <label data-i18n="fee_inr">手续费 (INR)</label>
        <input type="number" id="fee" value="0" step="0.01" oninput="calcFX()" placeholder="0">
      </div>
      <div class="input-group">
        <label data-i18n="fee_mode">手续费扣除方式</label>
        <select id="feeMode" onchange="calcFX()">
          <option value="deduct" data-i18n="fee_deduct">从到手金额中扣除</option>
          <option value="extra" data-i18n="fee_extra">额外支付</option>
        </select>
      </div>
    </div>

    <div class="result-box" id="fxResult"></div>
  </div>

  <div class="card">
    <h2 data-i18n="fx_history">📋 兑换记录</h2>
    <table id="fxHistory">
      <thead><tr><th data-i18n="date">日期</th><th data-i18n="direction">方向</th><th data-i18n="amount">金额</th><th data-i18n="received">到手</th><th data-i18n="pnl">盈亏</th><th></th></tr></thead>
    </table>
    <div id="fxEmpty" class="empty" data-i18n="fx_empty">暂无记录，点击下方按钮记录本次兑换</div>
    <br>
    <button class="btn green" onclick="saveFX()" data-i18n="save_fx">💾 记录本次兑换</button>
    <button class="btn red sm" onclick="clearFXHistory()" style="margin-left:8px" data-i18n="clear">清空记录</button>
  </div>
</div>

<!-- ========== 记账均摊 ========== -->
<div id="ledger" class="page">
  <div class="summary-bar" id="summary"></div>

  <div class="card">
    <h2 data-i18n="add_entry">📝 新增一笔</h2>
    <div class="row">
      <div class="input-group">
        <label data-i18n="item_label">项目</label>
        <input type="text" id="item" data-i18n-ph="item_ph" placeholder="如：午餐、打车">
      </div>
      <div class="input-group">
        <label data-i18n="amount_label">金额</label>
        <input type="number" id="cost" step="0.01" placeholder="0.00">
        <select id="currency" style="margin-top:6px;font-size:13px;padding:8px">
          <option value="CNY">CNY ¥</option>
          <option value="INR">INR ₹</option>
        </select>
      </div>
    </div>
    <div class="row">
      <div class="input-group">
        <label data-i18n="payer">付款人</label>
        <select id="payer"></select>
      </div>
      <div class="input-group">
        <label data-i18n="date">日期</label>
        <input type="date" id="date">
      </div>
    </div>
    <div class="input-group">
      <label data-i18n="note_label">备注</label>
      <input type="text" id="note" data-i18n-ph="note_ph" placeholder="可选备注">
    </div>
    <div class="input-group">
      <label data-i18n="split_who">参与人均摊（勾选参与的人）</label>
      <div id="splitWho" style="display:flex;flex-wrap:wrap;gap:6px;"></div>
    </div>
    <button class="btn" onclick="addEntry()" data-i18n="add">+ 添加</button>
  </div>

  <div class="card">
    <h2 data-i18n="person_mgmt">👥 人员管理</h2>
    <div class="row">
      <div class="input-group" style="flex:0 0 70%">
        <input type="text" id="newPerson" data-i18n-ph="person_ph" placeholder="输入名字，回车添加" onkeydown="if(event.key==='Enter')addPerson()">
      </div>
      <div class="input-group" style="flex:1;display:flex;align-items:flex-end">
        <button class="btn sm" onclick="addPerson()" data-i18n="add">添加</button>
      </div>
    </div>
    <div id="personList" style="margin-top:12px"></div>
  </div>

  <div class="card">
    <h2 data-i18n="ledger_detail">📊 账目明细</h2>
    <table id="ledgerTable">
      <thead><tr><th data-i18n="date">日期</th><th data-i18n="item_label">项目</th><th data-i18n="payer">付款人</th><th data-i18n="amount_label">金额</th><th data-i18n="split_who">均摊人</th><th></th></tr></thead>
    </table>
    <div id="ledgerEmpty" class="empty" data-i18n="ledger_empty">暂无记录</div>
  </div>

  <div class="card">
    <h2 data-i18n="settle_title">💸 结算建议</h2>
    <p style="color:var(--dim);font-size:13px;margin-bottom:12px" data-i18n="settle_desc">按均摊计算，谁该给谁多少钱，使所有人净支出相等</p>
    <div id="settleList"></div>
    <div id="settleEmpty" class="empty" data-i18n="settle_empty">添加账目后自动生成结算方案</div>
  </div>
</div>

try{sb=window.supabase.createClient(SB_URL,SB_KEY);}catch(e){console.warn('Supabase not loaded',e);sb=null;}

const $=id=>document.getElementById(id);
let lang=localStorage.getItem('lang')||'zh';

// ===== 数据层：Supabase 优先，离线降级到 localStorage =====
async function dbGetPersons(){
  if(sb){const{data,error}=await sb.from('persons').select('*').order('name');if(!error&&data)return data.map(r=>r.name);}
  return loadLS('persons');
}
async function dbAddPerson(name){
  if(sb){const{error}=await sb.from('persons').insert({name});if(error&&error.code==='23505')return;return;}
  const p=loadLS('persons');if(!p.includes(name))p.push(name);saveLS('persons',p);
}
async function dbDelPerson(name){
  if(sb){await sb.from('persons').delete().eq('name',name);return;}
  const p=loadLS('persons').filter(x=>x!==name);saveLS('persons',p);
}
async function dbGetEntries(){
  if(sb){const{data,error}=await sb.from('entries').select('*').order('created_at',{ascending:false});if(!error&&data)return data.map(e=>({...e,splitWho:e.split_who||[]}));}
  return loadLS('entries');
}
async function dbAddEntry(e){
  if(sb){const{error}=await sb.from('entries').insert({...e,split_who:JSON.stringify(e.splitWho)});return;}
  const a=loadLS('entries');a.push(e);saveLS('entries',a);
}
async function dbDelEntry(id){
  if(sb){await sb.from('entries').delete().eq('id',id);return;}
  const a=loadLS('entries').filter(e=>e.id!==id);saveLS('entries',a);
}
async function dbGetFX(){
  if(sb){const{data,error}=await sb.from('fx_history').select('*').order('created_at',{ascending:false});if(!error&&data)return data;}
  return loadLS('fx_history');
}
async function dbAddFX(r){
  if(sb){const{error}=await sb.from('fx_history').insert({date:r.date,direction:r.dir,amount:r.amount,my_rate:r.myRate,intl_rate:r.intlRate,fee:r.fee,got:r.got,intl_got:r.intlGot,diff:r.diff});return;}
  const a=loadLS('fx_history');a.unshift(r);saveLS('fx_history',a);
}
async function dbDelFX(idx){
  if(sb){const all=await dbGetFX();if(all[idx])await sb.from('fx_history').delete().eq('id',all[idx].id);return;}
  const a=loadLS('fx_history');a.splice(idx,1);saveLS('fx_history',a);
}
async function dbClearFX(){
  if(sb){await sb.from('fx_history').delete().neq('id',0);return;}
  localStorage.removeItem('fx_history');
}

function t(k){return I18N[lang][k]||k;}
function applyI18n(){
  document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=t(el.dataset.i18n);});
  document.querySelectorAll('[data-i18n-ph]').forEach(el=>{el.placeholder=t(el.dataset.i18nPh);});
  document.getElementById('langBtn').textContent=lang==='zh'?'EN':'中';
  document.documentElement.lang=lang==='zh'?'zh-CN':'en';
}
function toggleLang(){
  lang=lang==='zh'?'en':'zh';
  localStorage.setItem('lang',lang);
  applyI18n();calcFX();renderFXHistory();renderLedger();renderPersons();
}

// ===== Theme =====
let theme=localStorage.getItem('theme')||'dark';
function applyTheme(){
  if(theme==='light')document.documentElement.setAttribute('data-theme','light');
  else document.documentElement.removeAttribute('data-theme');
  document.getElementById('themeBtn').textContent=theme==='dark'?'🌙':'☀️';
}
function toggleTheme(){
  theme=theme==='dark'?'light':'dark';
  localStorage.setItem('theme',theme);
  applyTheme();
}

// ===== 页面切换 =====
function showPage(id,btn){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  $(id).classList.add('active');
  btn.classList.add('active');
}

// ===== 汇率换算 =====
function calcFX(){
  const dir=$('direction').value;
  const amt=parseFloat($('amount').value)||0;
  const myR=parseFloat($('myRate').value)||0;
  const intlR=parseFloat($('intlRate').value)||0;
  const fee=parseFloat($('fee').value)||0;
  const feeMode=$('feeMode').value;

  const isC2I=dir==='cny2inr';
  $('amountLabel').textContent=isC2I?t('amount_cny'):t('amount_inr');

  const got=amt*myR;
  const intlGot=amt*intlR;
  const actualGot=feeMode==='deduct'?got-fee:got;
  const intlDiff=actualGot-intlGot;
  const diffPct=intlGot>0?(intlDiff/intlGot*100):0;
  const curGot=isC2I?'INR':'CNY';

  let html=`<div class="result-row"><span class="result-label">${t('input_amount')}</span><span class="result-value">${fmt(amt)} ${isC2I?'CNY':'INR'}</span></div>`;
  if(fee>0){
    html+=`<div class="result-row"><span class="result-label">${t('fee_label')}</span><span class="result-value loss">-${fmt(fee)} INR</span></div>`;
    html+=`<div class="result-row"><span class="result-label">${t('got_before_fee')}</span><span class="result-value">${fmt(got)} ${curGot}</span></div>`;
  }
  html+=`<div class="result-row"><span class="result-label">${t('my_rate_label')}</span><span class="result-value">1 ${isC2I?'CNY':'INR'} = ${myR} ${curGot}</span></div>`;
  html+=`<div class="result-row"><span class="result-label">${t('intl_rate_label')}</span><span class="result-value" style="color:var(--dim)">1 ${isC2I?'CNY':'INR'} = ${intlR} ${curGot}</span></div>`;
  html+=`<div class="result-row" style="border-top:2px solid var(--border);margin-top:8px;padding-top:16px"><span class="result-label" style="font-size:16px;font-weight:700">${t('actual_got')}</span><span class="result-value" style="font-size:28px;color:var(--green)">${fmt(actualGot)} ${curGot}</span></div>`;
  html+=`<div class="result-row"><span class="result-label">${t('intl_should')}</span><span class="result-value" style="color:var(--dim)">${fmt(intlGot)} ${curGot}</span></div>`;

  if(intlR>0){
    const cls=intlDiff>=0?'profit':'loss';
    const badge=intlDiff>=0?`<span class="badge badge-green">${t('profit_badge')}</span>`:`<span class="badge badge-red">${t('loss_badge')}</span>`;
    html+=`<div class="result-row"><span class="result-label">${t('pnl')} ${badge}</span><span class="result-value ${cls}">${intlDiff>=0?'+':''}${fmt(intlDiff)} ${curGot} (${diffPct>=0?'+':''}${diffPct.toFixed(2)}%)</span></div>`;
  }
  $('fxResult').innerHTML=html;
}

function saveFX(){
  const dir=$('direction').value;
  const amt=parseFloat($('amount').value)||0;
  const myR=parseFloat($('myRate').value)||0;
  const intlR=parseFloat($('intlRate').value)||0;
  const fee=parseFloat($('fee').value)||0;
  const feeMode=$('feeMode').value;
  const got=amt*myR;
  const intlGot=amt*intlR;
  const actual=feeMode==='deduct'?got-fee:got;
  const intlDiff=actual-intlGot;

  dbAddFX({date:todayStr(),dir,amount:amt,myRate:myR,intlRate:intlR,fee,got:actual,intlGot,diff:intlDiff}).then(()=>{
    renderFXHistory();
  });
}

async function renderFXHistory(){
  const h=await dbGetFX();
  const tb=$('fxHistory');
  tb.querySelectorAll('tbody tr').forEach(r=>r.remove());
  if(!h.length){$('fxEmpty').style.display='block';return;}
  $('fxEmpty').style.display='none';
  const tbody=document.createElement('tbody');
  h.forEach((r,i)=>{
    const tr=document.createElement('tr');
    const isC2I=r.direction==='cny2inr';
    const cls=r.diff>=0?'profit':'loss';
    tr.innerHTML=`<td>${r.date}</td><td>${isC2I?'CNY→INR':'INR→CNY'}</td><td>${fmt(r.amount)}</td><td>${fmt(r.got)}</td><td class="${cls}">${r.diff>=0?'+':''}${fmt(r.diff)}</td><td><button class="del" onclick="delFX(${i})">✕</button></td>`;
    tbody.appendChild(tr);
  });
  tb.appendChild(tbody);
}

async function delFX(i){
  await dbDelFX(i);
  renderFXHistory();
}

async function clearFXHistory(){
  if(confirm(t('confirm_clear'))){
    await dbClearFX();
    renderFXHistory();
  }
}

// ===== 记账 =====
let persons=[];
let entries=[];
if(!persons.length)persons=[lang==='zh'?'我':'Me'];
$('date').value=todayStr();

async function loadData(){
  persons=await dbGetPersons();
  if(!persons.length){persons=[lang==='zh'?'我':'Me'];await dbAddPerson(persons[0]);}
  entries=await dbGetEntries();
  renderPersons();
  renderLedger();
}

function renderPersons(){
  const sel=$('payer');
  const sw=$('splitWho');
  sel.innerHTML='';
  sw.innerHTML='';
  $('personList').innerHTML='';

  persons.forEach((p,i)=>{
    const opt=document.createElement('option');
    opt.value=p;opt.textContent=p;
    sel.appendChild(opt);

    const lbl=document.createElement('label');
    lbl.style.cssText='display:flex;align-items:center;gap:4px;cursor:pointer;padding:6px 12px;border:1px solid var(--border);border-radius:20px;font-size:13px';
    lbl.innerHTML=`<input type="checkbox" value="${p}" checked style="width:auto"> <span class="${tagColor(i)}">${p}</span>`;
    sw.appendChild(lbl);

    const tag=document.createElement('span');
    tag.className=tagColor(i);
    tag.style.cssText+='margin:4px;display:inline-flex;align-items:center;gap:6px';
    tag.innerHTML=`${p} <span class="del" style="font-size:14px" onclick="delPerson(${i})">✕</span>`;
    $('personList').appendChild(tag);
  });
}

async function addPerson(){
  const v=$('newPerson').value.trim();
  if(!v)return;
  if(persons.includes(v)){alert(t('exists'));return;}
  await dbAddPerson(v);
  persons=await dbGetPersons();
  $('newPerson').value='';
  renderPersons();
  renderLedger();
}

async function delPerson(i){
  const name=persons[i];
  if(entries.some(e=>e.payer===name||e.splitWho.includes(name))){
    if(!confirm(`${name} ${t('in_records')}`))return;
  }
  await dbDelPerson(name);
  persons=await dbGetPersons();
  renderPersons();
  renderLedger();
}

async function addEntry(){
  const item=$('item').value.trim();
  const cost=parseFloat($('cost').value);
  const currency=$('currency').value;
  const payer=$('payer').value;
  const date=$('date').value;
  const note=$('note').value.trim();
  const splitWho=[...document.querySelectorAll('#splitWho input:checked')].map(c=>c.value);

  if(!item||!cost||!payer){alert(t('fill_required'));return;}
  if(!splitWho.length){alert(t('select_one'));return;}

  const entry={id:Date.now(),item,cost,currency,payer,date,note,splitWho};
  await dbAddEntry(entry);
  entries=await dbGetEntries();
  $('item').value='';$('cost').value='';$('note').value='';
  $('date').value=todayStr();
  renderLedger();
}

async function delEntry(id){
  await dbDelEntry(id);
  entries=await dbGetEntries();
  renderLedger();
}

function renderLedger(){
  const tb=$('ledgerTable');
  tb.querySelectorAll('tbody tr').forEach(r=>r.remove());
  if(!entries.length){$('ledgerEmpty').style.display='block';}
  else{$('ledgerEmpty').style.display='none';
    const tbody=document.createElement('tbody');
    [...entries].reverse().forEach(e=>{
      const payerIdx=persons.indexOf(e.payer);
      const cur=e.currency||'CNY';
      const sym=cur==='INR'?'₹':'¥';
      const tr=document.createElement('tr');
      const tags=e.splitWho.map(s=>{const idx=persons.indexOf(s);return `<span class="${tagColor(idx)}" style="font-size:11px">${s}</span>`}).join('');
      tr.innerHTML=`<td>${e.date}</td><td>${e.item}${e.note?'<br><span style="color:var(--dim);font-size:12px">'+e.note+'</span>':''}</td><td><span class="${tagColor(payerIdx)}">${e.payer}</span></td><td>${sym}${fmt(e.cost)}</td><td>${tags}</td><td><button class="del" onclick="delEntry(${e.id})">✕</button></td>`;
      tbody.appendChild(tr);
    });
    tb.appendChild(tbody);
  }

  const totalCNY=entries.filter(e=>(e.currency||'CNY')==='CNY').reduce((s,e)=>s+e.cost,0);
  const totalINR=entries.filter(e=>e.currency==='INR').reduce((s,e)=>s+e.cost,0);
  const personNet={};
  persons.forEach(p=>personNet[p]={CNY:0,INR:0});
  entries.forEach(e=>{
    const cur=e.currency||'CNY';
    const share=e.cost/e.splitWho.length;
    e.splitWho.forEach(s=>{
      personNet[s]=(personNet[s]||{CNY:0,INR:0});
      personNet[s][cur]=(personNet[s][cur]||0)-share;
    });
    personNet[e.payer]=(personNet[e.payer]||{CNY:0,INR:0});
    personNet[e.payer][cur]=(personNet[e.payer][cur]||0)+e.cost;
  });
  const allNet=Object.values(personNet);
  const maxNet=Math.max(...allNet.map(n=>n.CNY),0);
  const minNet=Math.min(...allNet.map(n=>n.CNY),0);
  $('summary').innerHTML=`
    <div class="summary-item"><div class="summary-num" style="color:var(--accent)">${totalCNY>0?'¥'+fmt(totalCNY):''}${totalCNY>0&&totalINR>0?' / ':''}${totalINR>0?'₹'+fmt(totalINR):''}</div><div class="summary-label">${t('total_spent')}</div></div>
    <div class="summary-item"><div class="summary-num" style="color:var(--green)">¥${fmt(maxNet)}</div><div class="summary-label">${t('max_paid')}</div></div>
    <div class="summary-item"><div class="summary-num" style="color:var(--red)">¥${fmt(Math.abs(minNet))}</div><div class="summary-label">${t('max_owe')}</div></div>`;

  const settles=[];
  for(const cur of ['CNY','INR']){
    const balances=Object.entries(personNet).map(([p,v])=>({p,v:v[cur]||0}));
    const debtors=balances.filter(b=>b.v<-0.01).sort((a,b)=>a.v-b.v);
    const creditors=balances.filter(b=>b.v>0.01).sort((a,b)=>b.v-a.v);
    let di=0,ci=0;
    while(di<debtors.length&&ci<creditors.length){
      const d=debtors[di],c=creditors[ci];
      const pay=Math.min(-d.v,c.v);
      settles.push({from:d.p,to:c.p,amount:pay,currency:cur});
      d.v+=pay;c.v-=pay;
      if(Math.abs(d.v)<0.01)di++;
      if(Math.abs(c.v)<0.01)ci++;
    }
  }

  const sl=$('settleList');
  sl.innerHTML='';
  if(!settles.length){$('settleEmpty').style.display='block';return;}
  $('settleEmpty').style.display='none';
  settles.forEach(s=>{
    const fromIdx=persons.indexOf(s.from);
    const toIdx=persons.indexOf(s.to);
    const sym=s.currency==='INR'?'₹':'¥';
    const div=document.createElement('div');
    div.className='settle-card';
    div.innerHTML=`<div><span class="${tagColor(fromIdx)}" style="font-size:16px">${s.from}</span><span class="settle-arrow">${t('settle_arrow')}</span><span class="${tagColor(toIdx)}" style="font-size:16px">${s.to}</span></div><div class="settle-amount">${sym}${fmt(s.amount)}</div>`;
    sl.appendChild(div);
  });
}

// ===== 初始化 =====
applyTheme();
applyI18n();
calcFX();
renderFXHistory();
loadData();
</script>
